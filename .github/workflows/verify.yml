name: Verify game
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: ./tools/bootstrap.sh
      - name: Test physics, UI, saves, assets and all courses
        run: ./tools/test.sh --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            build/*.log
            build/solver/
