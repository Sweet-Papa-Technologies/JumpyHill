name: Build TreadFall iOS beta
on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.5.0'
        required: true
      build:
        default: '15'
        required: true
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Export pinned game
        env:
          TREADFALL_BUILD_NUMBER: ${{ inputs.build }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tools/bootstrap.sh
          tools/export.sh iOS "$RELEASE_VERSION"
      - name: Build unsigned device archive
        run: |
          xcodebuild -project build/ios/TREADFALL.xcodeproj -scheme TREADFALL \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TREADFALL.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/TREADFALL.xcarchive" "$RUNNER_TEMP/TREADFALL-unsigned.zip"
      - name: Build and playtest on iPhone simulator
        run: |
          xcodebuild -project build/ios/TREADFALL.xcodeproj -scheme TREADFALL \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-ci-simulator CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES build
          python3 tools/store/ios-playtest.py build/ios-ci-simulator/Build/Products/Release-iphonesimulator/TREADFALL.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treadfall-ios-beta
          path: |
            ${{ runner.temp }}/TREADFALL-unsigned.zip
            build/ios-playtest/
            build/ios/TREADFALL.manifest.json
          retention-days: 14
